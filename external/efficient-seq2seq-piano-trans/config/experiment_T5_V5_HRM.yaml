# config/experiment_T5_V5_HRM.yaml
# Legacy file name retained for compatibility; the active encoder is now TRM-style.
defaults:
  - experiment_T5_V4_HierarchyPool

model:
  # Canonical recursive encoder.
  encoder_name: "TrmEncoder"

  # Rotary Positional Encoding (RoPE).
  trm_use_rope: true
  trm_rope_max_len: 2048
  trm_rope_theta: 10000.0

  # Shared recursive block: first local layer, then global layers.
  trm_layers: 2
  trm_recursions: 3
  trm_local_window_size: 64

  # Adaptive halting during inference only.
  trm_min_recursions: 2
  trm_halt_threshold: 0.5
  trm_halt_target_sharpness: 4.0

  # Per-recording embeddings.
  use_recording_id_embedding: false
  num_recordings: 1276
  recording_emb_dim: 64

training:
  notes: "V5_TRMV1_Recusion:4"
  trm_halt_loss_weight: 0.05

  # Keep other training settings from V4 (batch, lr, etc.)
