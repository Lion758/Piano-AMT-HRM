# config/experiment_T5_V6_TRMv2.yaml
# Faithful TRM v2 encoder with two-state recursion, deep supervision, and EMA.
defaults:
  - experiment_T5_V4_HierarchyPool

model:
  # Two-state TRM encoder (arXiv:2510.04871)
  encoder_name: "TrmEncoderV2"

  # Rotary Positional Encoding (RoPE)
  trm_use_rope: true
  trm_rope_max_len: 2048
  trm_rope_theta: 10000.0

  # Shared recursive block (2-layer transformer, paper optimal)
  trm_layers: 2
  trm_local_window_size: 64

  # Two-state recursion structure
  trm_H_cycles: 3            # T: full recursion processes (T-1 no-grad + 1 with-grad)
  trm_L_cycles: 6            # n: z_L updates per process before z_H update

  # Deep supervision
  trm_n_sup: 3               # N_sup: supervision steps reusing detached carry

  # Learned initial states
  trm_learned_init: true

  # ACT / halt mechanism (Q-learning, toggleable)
  trm_use_q_halt: true        # set to false to disable Q-learning halt entirely
  trm_halt_exploration_prob: 0.1

  # Auxiliary head for encoder-level deep supervision
  # Uses vocab_size from parent config (1024 for T5)
  trm_aux_vocab_size: ${model.vocab_size}

  # Gradient checkpointing for memory efficiency (enable on tight GPUs)
  trm_gradient_checkpointing: false

  # Per-recording embeddings (disabled by default)
  use_recording_id_embedding: false
  num_recordings: 1276
  recording_emb_dim: 64

training:
  notes: "V6_TRMv2_two_state_deep_sup"

  # EMA for training stability (paper: mu=0.999)
  use_ema: true
  ema_rate: 0.999

  # Loss weights
  trm_aux_loss_weight: 0.1          # auxiliary head deep supervision loss
  trm_halt_loss_weight: 0.05        # Q-learning halt loss
  trm_aux_loss_warmup_steps: 1000   # warmup steps before full aux loss weight
