defaults:
  - experiment_T5_V4_HierarchyPool

model:
  turbo_quant:
    enabled: true
    n_bits: 4  # Keys: nominal total bits; Values: exact MSE-only bits.
    qjl_projection_dim: 64  # Key-side only; when it matches head_dim, keys match the nominal total n_bits.
    enable_qjl: true
    min_cache_len: 64

  cross_attention_hierarchy_pooling: true
  pooling_sizes: [4, 4, 2, 2, 1, 1]
  # pooling_sizes: [4, 4, 4, 4, 4, 4]

training:
  notes: "Turbo"
