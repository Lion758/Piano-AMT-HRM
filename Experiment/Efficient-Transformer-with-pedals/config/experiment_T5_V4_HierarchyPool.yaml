defaults:
  - experiment_T5_V3_HybridGlobalLocalCrossAttn

model:
  checkpoint_path: /home/rachel/.group-5/Piano-AMT-HRM/Experiment/Efficient-Transformer-with-pedals/runs/Transformer-T5/260514-154114_Efficient_Transformer_V4_ConvHeads_100k_gaussian_/AMT-audio-to-midi/cuim96l1/checkpoints/epoch=56-step=100000.ckpt
  

  cross_attention_hierarchy_pooling: true
  pooling_sizes: [4, 4, 2, 2, 1, 1]
  # pooling_sizes: [4, 4, 4, 4, 4, 4]
  pedal_head_type: temporal_conv
  pedal_head_hidden: 64
  pedal_head_dropout: 0.1
  pedal_frame_head_kernel_size: 7
  pedal_onset_head_kernel_size: 11
  pedal_offset_head_kernel_size: 11

training:
  training_steps: 100000
  learning_rate: 1e-4
  notes: "Efficient_Transformer_V4_ConvHeads_100k_gaussian_"
  pedal_boundary_focal_gamma: 2.0
  losses:
    loss_pedal_onset:  [pedal_onset_logits,  pedal_onset_target,  loss.PedalBoundaryFocalLoss, 0.3]
    loss_pedal_offset: [pedal_offset_logits, pedal_offset_target, loss.PedalBoundaryFocalLoss, 0.3]
data:
  pedal_boundary_kernel_type: gaussian
  pedal_boundary_kernel_radius: 5
  pedal_boundary_kernel_sigma_frames: 3.0
  augmentation:
    enabled: false

evaluation:
  subset: test
  test_output_dir: evaluations/Gaussian_QFL_100k_test
