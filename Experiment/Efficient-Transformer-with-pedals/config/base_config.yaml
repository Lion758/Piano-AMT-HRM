defaults:
  # - model: Conformer
  # - model: HPPNet
  # - model: HPPformer
  - model: T5
  # - model: hFT_Transformer
  - data: data_config
  - training: training_config
  
devices: [0] # -1
accelerator: gpu
audio_path: "audio/Passionfruit_Katherine_Cordova.mp3"

data:
    sequence_type: compound-word # performance-sequence, score-sequence

    dataset_dirs: [/home/rachel/.group-5/Piano-AMT-HRM/Backend/efficient-seq2seq-piano-trans/dataset/maestro-v3.0.0] # shared backend MAESTRO cache
    dataset_sequence_types: [performance-sequence] # performance-sequence, score-sequence
    cache_dir_name: cache

    features:  mel # cqt # log-stft, cqt, mel
    amplitude_to_db: true #true
    num_mel_bins: 360 # 512
    decoder_targets: decoder_targets
    token_types: performance-seq
    use_truth_offsets: true # false = use pedal-extended offsets; true = use raw physical key-release offsets
    emit_pedal_tokens: true # false = literature-style baseline with no pedal tokens in target sequence
    midi_min: 0
    midi_max: 127
    n_frames: 256 #  512, 1024, 2048
    max_token_length: 400 # 128, 256, 400, 512, 1024, 2048
model:
  # input_seq_length: ${data.n_frames} # should be the same with data.n_frames (if there is no downsampling) # 512 # 1024 # 2048 # 512
  froze_encoder: false
  # froze_encoder: true
  strict_checkpoint: false

  checkpoint_ignore_layres: [
    "decoder.dense_onset_by_AttnMap.intermediate_layers.0.weight", 
    "decoder.dense_onset_by_AttnMap.intermediate_layers.0.bias", 
    "decoder.dense_onset_by_AttnMap.dense_layer.weight", 
    "decoder.dense_onset_by_AttnMap.dense_layer.bias"
  ]

evaluation:
  report_pedal_extended: true # if true, add reference-style same-pitch-capped pedal-extended note metrics plus uncapped diagnostics
  save_track_json: true # per-track token chunks for debugging/repro without rerunning the model
  save_output_midi: false # reconstructed prediction MIDI for listening/inspection
  copy_reference_midi: false # copied ground-truth MIDI for side-by-side comparison

training:
  notes: "T5"
  mode: train
  # mode: test
  batch: 32 # 12 # 16  #4
  batch_test: 256 # 64 # 256
  batch_inference: 64
  learning_rate: 1e-4
  evaluation_epochs: 5
  online_testing: false

  debug_log_offline: true
  losses:
    loss_decoder:      [decoder_outputs, decoder_targets, loss.CrossEntropyLoss]
    loss_pedal_state:  [pedal_frame_logits,  pedal_frame_target,  loss.PedalFrameBCELoss, 0.3]
    loss_pedal_onset:  [pedal_onset_logits,  pedal_onset_target,  loss.PedalFrameBCELoss, 0.3]
    loss_pedal_offset: [pedal_offset_logits, pedal_offset_target, loss.PedalFrameBCELoss, 0.3]
